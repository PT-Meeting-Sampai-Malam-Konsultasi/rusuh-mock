$kind: http-example
name: 400 Invalid
request:
  method: POST
  url: 'http://localhost:8080/api/v1/verifications'
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "error": "Bad Request",
        "message": "\"nik\" must be a valid Indonesian NIK (16 digits with a valid birth date component)"
      }
