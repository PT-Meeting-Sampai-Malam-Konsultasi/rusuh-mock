$kind: http-request
name: 'GET /health/ready'
method: GET
url: '{{base_url}}/health/ready'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('reports readiness', () => pm.expect(pm.response.json()).to.eql({ status: 'ready' }));
