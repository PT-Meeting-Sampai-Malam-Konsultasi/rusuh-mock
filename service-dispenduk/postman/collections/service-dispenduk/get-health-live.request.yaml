$kind: http-request
name: 'GET /health/live'
method: GET
url: '{{base_url}}/health/live'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('reports operational status', () => pm.expect(pm.response.json()).to.eql({ status: 'ok' }));
