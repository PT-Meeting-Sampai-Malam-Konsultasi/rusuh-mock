$kind: http-request
name: 'POST /api/v1/verifications'
method: POST
url: '{{base_url}}/api/v1/verifications'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nik": "9901010101900001",
      "name": "Budi Santoso"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('returns a verification result', () => pm.expect(pm.response.json().data.valid).to.be.a('boolean'));
examples: './.resources/create-verification.resources/examples'
