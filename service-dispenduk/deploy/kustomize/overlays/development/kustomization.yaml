apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: development
resources:
  - ../../base
images:
  - name: '{{CONTAINER_IMAGE}}'
    newName: '{{DEVELOPMENT_CONTAINER_IMAGE}}'
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: nodejs-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: development
  - target:
      kind: HorizontalPodAutoscaler
      name: nodejs-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
