sonar.projectKey={{SERVICE_NAME}}
sonar.qualitygate.wait=true
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**/*.test.js
sonar.exclusions=**/node_modules/**,coverage/**,deploy/**,docs/**,postman/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.junit.reportPaths=coverage/junit.xml
sonar.sourceEncoding=UTF-8
