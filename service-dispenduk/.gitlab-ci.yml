include:
  - project: my-telkomsel/pipeline-template-assets/stage-templates
    ref: main
    file: be-stages.yml

variables:
  SERVICE_NAME: '{{SERVICE_NAME}}'
  DOCKERFILE_PATH: './Dockerfile'

quality:
  stage: test
  image: node:20.16.0-bookworm
  script:
    - npm ci --ignore-scripts
    - npm run check
  artifacts:
    when: always
    reports:
      junit: coverage/junit.xml
    paths:
      - coverage/

kustomize-validate:
  stage: test
  image: bitnami/kubectl:1.31
  script:
    - kubectl kustomize deploy/kustomize/base
    - kubectl kustomize deploy/kustomize/overlays/development

docker-build:
  stage: build
  script:
    - docker build --secret id=npmrc,src=.npmrc -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
  rules:
    - if: '$CI_COMMIT_BRANCH'
